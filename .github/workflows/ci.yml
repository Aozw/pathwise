name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs so a fast series of pushes does not burn Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      # Cheap guard against the one mistake that cannot be undone by reverting.
      - name: Reject tracked secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|(^|/)credentials$|\.aws/'; then
            echo "::error::A secret-looking file is tracked by git. Remove it and rotate the key."
            exit 1
          fi

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          # No AWS credentials are provided on purpose. Tests must run against
          # data/fixtures/. This makes an accidental live call fail fast instead
          # of hanging on credential lookup.
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set +e
          pytest -q
          code=$?
          set -e
          # exit code 5 means "no tests collected", which is fine before tests exist
          if [ "$code" -eq 5 ]; then
            echo "No tests collected yet."
            exit 0
          fi
          exit "$code"