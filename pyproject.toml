[project]
name = "pathwise"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["web", "data", ".venv"]

[tool.ruff.lint]
# E/F are the correctness rules, I sorts imports, UP catches dated syntax,
# B catches real bugs like mutable default arguments.
select = ["E", "F", "I", "UP", "B"]
# Line length is not worth arguing about at 2am.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
